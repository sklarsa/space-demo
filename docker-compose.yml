services:
  questdb:
    image: questdb/questdb:latest
    # Localhost only: the public surface is server.py, never QuestDB itself.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9009:9009", "127.0.0.1:8812:8812"]
    environment:
      QDB_HTTP_SECURITY_READONLY: "true" # REST /exec and web console can't modify data; feeder DDL uses PG wire
      QDB_QUERY_TIMEOUT: "5s"
    volumes: ["qdb:/var/lib/questdb"]
volumes:
  qdb:
